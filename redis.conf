# Redis Configuration for Multimodal Inspiration Recorder
# This configuration prevents the "read-only replica" issue

# Persistence
appendonly yes
appendfilename "appendonly.aof"

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Disable RDB snapshots (we only use AOF for persistence)
save ""

# IMPORTANT: Force Redis to always be a master node
# This prevents the container from becoming a replica after restart
# even if the AOF file contains a REPLICAOF command
replica-read-only yes

# Network
bind 0.0.0.0
protected-mode no
port 6379

# Logging
loglevel notice

# Performance
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Prevent replica configuration from persisting
# If someone accidentally runs REPLICAOF, it won't persist
# (Note: This is a safeguard, but manual cleanup may still be needed)
