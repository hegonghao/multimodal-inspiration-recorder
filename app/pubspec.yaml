name: multimodal_inspiration_recorder
description: 多模输入灵感记录器 - 支持语音、图片、文字的灵感捕捉应用
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Theming
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1

  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9

  # Local Database (Drift)
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3

  # Audio Recording
  record: ^6.1.2
  permission_handler: ^11.1.0
  audio_waveforms: ^1.0.5

  # Image & Camera
  image_picker: ^1.0.5
  image: ^4.1.3
  camera: ^0.10.5+7

  # OCR (ML Kit)
  google_mlkit_text_recognition: ^0.11.0
  google_mlkit_commons: ^0.6.0

  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0

  # Connectivity
  connectivity_plus: ^6.0.0
  internet_connection_checker: ^1.0.0+1

  # Secure Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # File Handling
  file_picker: ^10.0.0
  open_filex: ^4.3.4
  package_info_plus: ^8.3.0

  # Date & Time
  intl: ^0.18.1
  timeago: ^3.6.0

  # JSON & Serialization
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1

  # Logging
  logger: ^2.0.2+1

  # Background Tasks (Android WorkManager, iOS BackgroundFetch)
  workmanager: ^0.9.0

  # Notifications
  flutter_local_notifications: ^19.0.0

  # UI Utilities
  shimmer: ^3.0.0
  lottie: ^2.7.0
  flutter_spinkit: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.7
  drift_dev: ^2.14.1
  json_serializable: ^6.7.1
  freezed: ^2.4.6

  # Linting
  flutter_lints: ^3.0.1
  very_good_analysis: ^5.1.0

  # Testing
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/

  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: fonts/Roboto-Regular.ttf
  #       - asset: fonts/Roboto-Bold.ttf
  #         weight: 700
