[pytest]
# Pytest configuration for multimodal inspiration recorder backend

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, require services)
    contract: Contract tests (API schema validation)
    performance: Performance tests (Constitution compliance validation)
    slow: Slow tests (performance, stress tests)
    asyncio: Async tests

# Asyncio mode
asyncio_mode = auto

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=backend.src
    --cov-report=term-missing
    --cov-report=html:coverage_html
    --cov-fail-under=90

# Coverage configuration
[coverage:run]
source = backend/src
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
